; PlatformIO Project Configuration File

[platformio]
default_envs = uno_r4_wifi

[env]
monitor_speed = 9600

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.2
  adafruit/Adafruit GFX Library@^1.11.3
  miguelbalboa/MFRC522@^1.4.12
  knolleary/PubSubClient@^2.8
platform_packages = toolchain-gccarmnoneeabi@~1.90301.0 ; remove when testing local
