services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"  # Standard MQTT port
      - "9001:9001"  # WebSocket port
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      - ./mosquitto/config/entrypoint.sh:/docker-entrypoint.sh
    entrypoint: /docker-entrypoint.sh
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    restart: unless-stopped

  ##################################################################################

  mariadb:
    container_name: mariadb
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mariadb/mariadb_init:/docker-entrypoint-initdb.d:ro
      - mariadb_data:/var/lib/mysql
    ports:
      - ${DB_PORT}:3306
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  ##################################################################################

  java-backend:
    container_name: java-backend
    image: java-backend:latest
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./java-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT_TCP}
      MQTT_MESSAGE_PREFIX: ${MQTT_MESSAGE_PREFIX}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    depends_on:
      mosquitto:
        condition: service_started
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  ##################################################################################

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: game1234!
    ports:
      - "8081:80"
    depends_on:
      - mariadb
    restart: unless-stopped

  ##################################################################################

  frontend:
    container_name: frontend
    image: nginx:latest
    volumes:
      - ./frontend/nginx/conf.d:/etc/nginx/conf.d
      - ./frontend:/usr/share/nginx/html
    ports:
      - "80:80"
      - "443:443"
    environment:
      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT_WS}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_MESSAGE_PREFIX: ${MQTT_MESSAGE_PREFIX}
    restart: unless-stopped

  ##################################################################################

  web-controller:
    container_name: web-controller
    image: nginx:latest
    volumes:
      - ./web-controller/nginx/conf.d:/etc/nginx/conf.d
      - ./web-controller:/usr/share/nginx/html
      - ./web-controller/nginx/entrypoint.sh:/docker-entrypoint.d/entrypoint.sh
    ports:
      - "81:81"
      - "444:443"
    environment:
      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT_WS}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_MESSAGE_PREFIX: ${MQTT_MESSAGE_PREFIX}
    restart: unless-stopped

##################################################################################
##################################################################################

volumes:
  mariadb_data:

##################################################################################
##################################################################################

networks:
  default:
    name: game-network